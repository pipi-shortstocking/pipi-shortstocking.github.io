<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA routing fallback
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect.startsWith("/")) {
        history.replaceState(null, null, redirect);
      }
    </script>
  </head>
  <body></body>
</html>
